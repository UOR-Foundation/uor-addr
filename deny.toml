# `cargo-deny` configuration — license + advisory gate for the
# uor-addr workspace. Run via `cargo deny check` or the `deny` job in
# `.github/workflows/ci.yml`.

[advisories]
version = 2
ignore = []

[licenses]
version = 2
# Apache-2.0 is the crate's chosen license. Permissive ecosystem
# licenses (MIT / BSD / Unicode-DFS) are admissible for transitive
# deps. Copyleft (GPL / LGPL / AGPL / MPL) is not — the crate ships
# Apache-2.0 only.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
