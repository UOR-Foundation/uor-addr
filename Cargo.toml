[workspace]
resolver = "2"
members = ["crates/uor-addr-1"]

[workspace.dependencies]
# Façade — re-exports the foundation substrate plus the four Layer-3
# axis sub-crates (`prism::crypto`, `prism::numerics`, `prism::tensor`,
# `prism::fhe`) and the TC-05 replay surface (`prism::replay`,
# `prism::seal`). Per ADR-031, downstream Prism applications consume
# this façade rather than the substrate directly.
uor-prism          = { version = "0.1.1", default-features = false }
uor-prism-verify   = { version = "0.1.1", default-features = false }
# Substrate kept as a direct dep because the SDK macros expand to
# absolute `::uor_foundation::*` paths; the façade alone is insufficient
# until ADR-031 fully relocates the macro emission targets.
uor-foundation     = { version = "0.4.12" }
uor-foundation-sdk = { version = "0.4.12" }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"

[profile.dev]
opt-level = 0
debug     = true

[profile.test]
opt-level = 1
