[workspace]
resolver = "2"
members = ["crates/uor-addr-1"]

[workspace.dependencies]
uor-foundation     = { version = "0.4.5" }
uor-foundation-sdk = { version = "0.4.5" }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"

[profile.dev]
opt-level = 0
debug     = true

[profile.test]
opt-level = 1
